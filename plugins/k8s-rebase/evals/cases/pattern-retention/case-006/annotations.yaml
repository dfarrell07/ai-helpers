notes: >
  openshift/cluster-network-operator — deploys and configures OVN-K on
  OpenShift. Heavy openshift/api and operator-framework dependencies
  mean more .go call-site changes are expected than in smaller repos.
  CNO-specific operator wiring (reconciler logic, status conditions)
  should not be touched unless it directly fails compilation post-bump;
  any diff in those areas warrants scrutiny.
